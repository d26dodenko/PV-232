<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Лист — книжный магазин{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('catalog') }}">Лист<span>книжный магазин</span></a>
      <nav aria-label="Главное меню">
        <a href="{{ url_for('catalog') }}">Каталог</a>
        {% if user %}
          <a href="{{ url_for('cart') }}">Корзина</a>
          <span>{{ user.name }}</span>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="secondary" type="submit">Выйти</button>
          </form>
        {% else %}
          <a href="{{ url_for('register') }}">Регистрация</a>
          <a href="{{ url_for('login') }}">Войти</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% for message in get_flashed_messages() %}
        <p class="notice" role="status">{{ message }}</p>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
    <footer>Оплата при получении · Доставка бесплатно</footer>
  </body>
</html>
