[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chernobrovenko-bookshop"
version = "1.0.0"
description = "Bookshop for UI testing and CI quality gates"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookshop = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["bookshop"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
