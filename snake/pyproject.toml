[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-snake-lab"
version = "1.0.0"
description = "A testable Pygame Snake game"
requires-python = ">=3.9"
dependencies = ["pygame==2.6.1"]

[project.scripts]
mint-snake = "snake_game.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["snake_game"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
