<text x="550.0" y="303" font-size="20" font-weight="700" text-anchor="middle">Слой бизнес-логики</text>
<text x="550.0" y="331" font-size="17" font-weight="400" text-anchor="middle">Сценарии регистрации, публикации и импорта</text>
<text x="550.0" y="355" font-size="17" font-weight="400" text-anchor="middle">Права владельца · порядок глав · целостность операций</text>
