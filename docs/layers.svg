<text x="550.0" y="666" font-size="20" font-weight="700" text-anchor="middle">PostgreSQL</text>
<text x="550.0" y="694" font-size="17" font-weight="400" text-anchor="middle">Пользователи, сессии, книги, главы</text>
<path d="M550,205 L550,273" fill="none" stroke="#486078" stroke-width="2" marker-end="url(#arrow)"/>
