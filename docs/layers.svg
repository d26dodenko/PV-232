<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title">
<title id="title">Многослойная архитектура «Переплёта»</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486078"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#203448">
<text x="550.0" y="38" font-size="25" font-weight="700" text-anchor="middle">Многослойная архитектура «Переплёта»</text>
<rect x="135" y="80" width="830" height="125" rx="10" fill="#eef4fb" stroke="#9db3c8" stroke-width="1.5"/>
