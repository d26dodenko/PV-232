<text x="550.0" y="138" font-size="17" font-weight="400" text-anchor="middle">React · каталог, читалка, формы автора</text>
<text x="550.0" y="162" font-size="17" font-weight="400" text-anchor="middle">HTTP API · запросы, ответы и формат входных данных</text>
